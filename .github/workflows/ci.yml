name: Checks
on:
  workflow_dispatch:
    inputs:
      browser_suite:
        description: Browser checks to run
        type: choice
        default: eight-only
        options:
          - eight-only
          - ability-interactions
          - deployment
          - all
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/testing.md
      - docs/progress.md
      - docs/deployment.json
      - docs/qa/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/testing.md
      - docs/progress.md
      - docs/deployment.json
      - docs/qa/**
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'all' && 90 || 30 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Choose validation scope
        id: validation
        run: node scripts/ci-validation-scope.mjs
        env:
          REQUESTED_SUITE: ${{ inputs.browser_suite }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm typecheck
      # Run the fast rule/protocol regressions once, instead of overlapping subsets.
      - name: Validate rules, persistence, transports and deployment guards
        run: pnpm test
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec playwright install --with-deps chromium
      # The automatic UI gate stays small; long visual matrices are manual.
      - name: Validate dice batches, choice details, event reasons and chat layout
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test tests/browser/interaction-feedback.spec.ts tests/browser/chat-layout.spec.ts
        env:
          CI: true
      - name: Validate relay snapshot and playback diagnostic helpers
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test -c playwright.relay.config.ts --grep "snapshot aggregation|playback skip|playback diagnostics"
        env:
          CI: true
      - name: Validate one eight-player race with recovery and privacy
        if: steps.validation.outputs.suite == 'eight-only' || steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test -c playwright.relay.config.ts --grep "server authority 8 independent"
        env:
          CI: true
          RELAY_SMOKE: '1'
      - name: Validate server selection and independent backend sessions
        if: steps.validation.outputs.suite == 'deployment' || steps.validation.outputs.suite == 'all'
        run: |
          pnpm exec playwright test tests/browser/dual-backend.spec.ts tests/browser/home-entry.spec.ts
          pnpm exec playwright test -c playwright.dual.config.ts
        env:
          CI: true
      - name: Validate ability details and public reveals
        if: steps.validation.outputs.suite == 'ability-interactions' || steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test tests/browser/egg-character-info.spec.ts tests/browser/ability-reveal-intro.spec.ts
        env:
          CI: true
      - name: Validate manual presentation and camera regressions
        if: steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test tests/browser/presentation-sequence.spec.ts tests/browser/dice-readback.spec.ts tests/browser/card-background.spec.ts tests/browser/camera-choreography.spec.ts tests/browser/route-selection-preview.spec.ts
        env:
          CI: true
      - name: Preserve visual observations before later browser suites
        if: always() && steps.validation.outputs.suite == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regressions
          path: |
            test-results/
            docs/qa/camera-choreography/
          retention-days: 7
      - name: Validate manual competition, event and room lifecycle flows
        if: steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test tests/browser/competition.spec.ts tests/browser/special-events.spec.ts tests/browser/room-continuation.spec.ts
        env:
          CI: true
      - name: Validate manual map scenes and controls
        if: steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test tests/browser/new-track-scenes.spec.ts tests/browser/whirly-model.spec.ts tests/browser/expansion-bridges.spec.ts tests/browser/expansion-movement.spec.ts tests/browser/expansion-low.spec.ts tests/browser/three-scene.spec.ts
        env:
          CI: true
      - name: Validate manual room directory and spectating
        if: steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test -c playwright.relay.config.ts tests/relay-browser/room-directory.spec.ts --grep "directory:"
        env:
          CI: true
      - name: Package the checked Linux build for both backends
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: bash scripts/deploy/ci-artifacts.sh "$CHECKED_COMMIT" "$DEPLOY_TARGET" "$GITHUB_RUN_ID" "$PR_NUMBER" "$RUNNER_TEMP/backend-artifacts"
        env:
          CHECKED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
      - name: Upload checked Aliyun Linux bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/backend-artifacts/aliyun/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload checked Worker bundle and assets
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/backend-artifacts/worker/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-failures
          path: test-results/
