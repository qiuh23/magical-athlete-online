name: Checks
on:
  workflow_dispatch:
    inputs:
      browser_suite:
        description: Browser checks to run
        type: choice
        default: eight-only
        options:
          - eight-only
          - ability-interactions
          - deployment
          - all
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/testing.md
      - docs/progress.md
      - docs/deployment.json
      - docs/qa/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/testing.md
      - docs/progress.md
      - docs/deployment.json
      - docs/qa/**
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'all' && 90 || 30 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Choose validation scope
        id: validation
        run: node scripts/ci-validation-scope.mjs
        env:
          REQUESTED_SUITE: ${{ inputs.browser_suite }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm typecheck
      - name: Validate runtime backends, credentials, creation retries and quotas
        run: pnpm exec tsx --test tests/random-id.test.ts tests/backends.test.ts tests/network-backends.test.ts tests/dual-backend-server.test.ts tests/dual-backend-worker.test.ts tests/owner-recovery.test.ts tests/community-network.test.ts tests/deployment-capacity.test.ts tests/deployment-info.test.ts tests/ci-validation-scope.test.ts tests/ci-installer.test.ts tests/deployment-workflow.test.ts
      - name: Validate frozen schedules, long drafting, score audit and worker persistence
        run: pnpm exec tsx --test tests/competition.test.ts tests/schedule-review.test.ts tests/rules-version.test.ts tests/relay.test.ts
      - name: Validate Scout playback and owner-absence room lifecycle
        run: pnpm exec tsx --test tests/fan-expansions.test.ts tests/presentation.test.ts tests/room-continuation.test.ts tests/room-lifecycle.test.ts tests/community-network.test.ts
      - name: Validate map topology, abilities, Twists and saved map matches
        run: pnpm exec tsx --test tests/leaf-tracks.test.ts tests/new-track-scenes.test.ts tests/whirly-model.test.ts tests/map-rules.test.ts tests/map-targets.test.ts tests/leaf-map-abilities.test.ts tests/map-matches.test.ts tests/twist-cards.test.ts tests/twist-integration.test.ts
      - name: Validate expansion scenery and delivered model assets
        run: pnpm exec tsx --test tests/expansion-scenery.test.ts tests/bridges-display.test.ts tests/revolutionary-sculpt.test.ts tests/avatars.test.ts tests/mouth-surfaces.test.ts
      - name: Validate special events, official card corrections and mixed long schedules
        run: pnpm exec tsx --test tests/special-events.test.ts tests/event-matches.test.ts tests/second-wind.test.ts tests/second-wind-review.test.ts tests/copy-ability-interactions.test.ts
      - run: pnpm test
        if: steps.validation.outputs.suite == 'all'
      - run: pnpm test:abilities
        if: steps.validation.outputs.suite == 'ability-interactions'
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate dice causality, stable chat and flat card backgrounds
        run: pnpm exec playwright test tests/browser/presentation-sequence.spec.ts tests/browser/chat-layout.spec.ts tests/browser/card-background.spec.ts --grep "Triangle waits|six-dice threes|single skill die|choosing an existing six-dice|stage NPC triggering|wandering monster dice|special-event NPC die|race chat stays anchored|flat blue and yellow cards"
        env:
          CI: true
      - name: Validate server selection, desktop/mobile and independent backend sessions
        run: |
          pnpm exec playwright test tests/browser/dual-backend.spec.ts
          pnpm exec playwright test -c playwright.dual.config.ts
        env:
          CI: true
      - name: Validate home entries and player/spectator admission
        run: pnpm exec playwright test tests/browser/home-entry.spec.ts
        env:
          CI: true
      - name: Validate route dice reminder and pre-race map preview
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test tests/browser/route-selection-preview.spec.ts
        env:
          CI: true
      - name: Validate home configuration, pending choices and rematch setup
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test tests/browser/competition.spec.ts --grep "home shows|tour can be created|two browsers preserve|rematch"
        env:
          CI: true
      - name: Validate complete four, six and eight-race competitions
        if: steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test tests/browser/competition.spec.ts --grep "independent browsers finish"
        env:
          CI: true
      - name: Validate representative Whirly and Bridges scenes
        if: steps.validation.outputs.suite != 'all' && steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test tests/browser/new-track-scenes.spec.ts tests/browser/whirly-model.spec.ts tests/browser/expansion-bridges.spec.ts --grep "whirly-world actual|Whirly|Bridges actual scene"
        env:
          CI: true
      - name: Validate new map scenes and controls
        if: steps.validation.outputs.suite == 'all'
        run: pnpm exec playwright test tests/browser/new-track-scenes.spec.ts tests/browser/whirly-model.spec.ts tests/browser/expansion-bridges.spec.ts tests/browser/expansion-movement.spec.ts tests/browser/expansion-low.spec.ts
        env:
          CI: true
      - name: Validate special event setup, private choices and refresh
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test tests/browser/special-events.spec.ts
        env:
          CI: true
      - name: Validate owner-absence voting and current-race closure
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test tests/browser/room-continuation.spec.ts
        env:
          CI: true
      # Default to one eight-player race with reconnects. A validation trailer
      # can select focused ability checks; broad suites stay manual.
      - name: Validate room-list admission and spectating
        run: pnpm exec playwright test -c playwright.relay.config.ts tests/relay-browser/room-directory.spec.ts --grep "directory:"
        env:
          CI: true
      - run: pnpm exec playwright test tests/browser/three-scene.spec.ts --grep "3D dice settles|3D simultaneous"
        if: steps.validation.outputs.suite == 'all'
        env:
          CI: true
      - name: Validate relay snapshot and playback diagnostic helpers
        if: steps.validation.outputs.suite != 'deployment'
        run: pnpm exec playwright test -c playwright.relay.config.ts --grep "snapshot aggregation|playback skip|playback diagnostics"
        env:
          CI: true
      - run: pnpm exec playwright test -c playwright.relay.config.ts --grep "server authority 8 independent"
        if: steps.validation.outputs.suite != 'ability-interactions' && steps.validation.outputs.suite != 'deployment'
        env:
          CI: true
          RELAY_SMOKE: '1'
      - run: pnpm exec playwright test tests/browser/egg-character-info.spec.ts tests/browser/ability-reveal-intro.spec.ts
        if: steps.validation.outputs.suite == 'ability-interactions'
        env:
          CI: true
      - name: Package the checked Linux build for both backends
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: bash scripts/deploy/ci-artifacts.sh "$CHECKED_COMMIT" "$DEPLOY_TARGET" "$GITHUB_RUN_ID" "$PR_NUMBER" "$RUNNER_TEMP/backend-artifacts"
        env:
          CHECKED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
      - name: Upload checked Aliyun Linux bundle
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/backend-artifacts/aliyun/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload checked Worker bundle and assets
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/backend-artifacts/worker/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-failures
          path: test-results/
